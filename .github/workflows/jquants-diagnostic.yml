name: J-Quants diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/jquants-diagnostic.yml'

jobs:
  test-jquants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test repository J-Quants secret
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          key = os.getenv('JQUANTS_API_KEY', '')
          print(f'[DIAG] key present={bool(key)}')
          if not key:
              raise SystemExit('JQUANTS_API_KEY is empty in this repository')

          url = 'https://api.jquants.com/v2/equities/master?' + urllib.parse.urlencode({'limit': 1})
          req = urllib.request.Request(url, headers={'x-api-key': key, 'User-Agent': 'stock-diagnostic/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  body = res.read().decode('utf-8')
                  print(f'[DIAG] HTTP status={res.status}')
                  payload = json.loads(body)
                  rows = payload.get('data') or payload.get('listed_info') or []
                  print(f'[DIAG] returned rows={len(rows)}')
                  print(f'[DIAG] payload keys={sorted(payload.keys())}')
          except Exception as exc:
              print(f'[DIAG] request failed: {type(exc).__name__}: {exc}')
              raise
          PY
